user nginx;
worker_processes auto;
error_log /app/nginx/logs/error.log;
pid /app/nginx/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /app/nginx/logs/access.log  main;
    
    client_body_temp_path /app/nginx/cache/client_temp;
    proxy_temp_path       /app/nginx/cache/proxy_temp_path;
    fastcgi_temp_path     /app/nginx/cache/fastcgi_temp;
    uwsgi_temp_path       /app/nginx/cache/uwsgi_temp;
    scgi_temp_path        /app/nginx/cache/scgi_temp;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    server {
        listen 3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://localhost:8080/api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_read_timeout 86400;
        }
    }
}